<!-- FILEPATH: tempaltes/jdimport/upload.html -->
{% extends 'base.html' %}
{% load static %}
{% block title %}Bulk Import Job Descriptions | ATS Workspace{% endblock %}
{% block extra_head %}

<style>
    .back-icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        margin-bottom: 18px;
        transition: border-color 0.15s ease, color 0.15s ease;
    }

    .back-icon-btn svg {
        width: 18px;
        height: 18px;
    }

    .back-icon-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
    }

    .jd-dropzone {
        border: 1.5px dashed var(--border);
        border-radius: 16px;
        padding: 40px 24px;
        text-align: center;
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease;
    }

    .jd-dropzone.dragover,
    .jd-dropzone:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
    }

    .jd-dropzone-icon {
        width: 26px;
        height: 26px;
        color: var(--text-muted);
        margin: 0 auto 8px;
    }

    .jd-dropzone-title {
        font-weight: 600;
        color: var(--text);
        margin-bottom: 6px;
    }

    .jd-dropzone-hint {
        color: var(--text-muted);
        font-size: 0.88rem;
    }

    .jd-file-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
    }

    .jd-file-row {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .jd-file-serial {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--primary-soft);
        color: var(--primary-soft-text);
        font-size: 0.72rem;
        font-weight: 600;
        flex-shrink: 0;
    }

    .jd-file-name {
        min-width: 140px;
        max-width: 220px;
        font-weight: 500;
        color: var(--text);
        word-break: break-word;
        font-size: 0.88rem;
        flex-shrink: 0;
    }

    .jd-progress-track {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: var(--surface-soft);
        border: 1px solid var(--border);
        overflow: hidden;
    }

    .jd-progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--primary);
        transition: width 320ms ease, background 320ms ease;
    }

    .jd-progress-fill.state-done {
        background: var(--success-text);
    }

    .jd-progress-fill.state-failed {
        background: var(--danger-text);
    }

    .jd-progress-percent {
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--text-muted);
        min-width: 34px;
        text-align: right;
        flex-shrink: 0;
    }

    .jd-stage-text {
        font-size: 0.78rem;
        color: var(--text-muted);
        flex-shrink: 0;
        min-width: 120px;
        text-align: right;
    }

    .jd-stage-text.state-done {
        color: var(--success-text);
    }

    .jd-stage-text.state-failed {
        color: var(--danger-text);
    }

    .jd-file-remove {
        flex-shrink: 0;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
    }

    .jd-file-remove:hover {
        border-color: var(--danger-text);
        color: var(--danger-text);
    }

    .jd-file-remove svg {
        width: 13px;
        height: 13px;
    }

    .jd-upload-actions {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
        flex-wrap: wrap;
    }

    .btn-success {
        background: var(--success-text);
        color: #fff;
        border: none;
    }

    .btn-success:hover {
        filter: brightness(1.08);
    }

    .hidden {
        display: none !important;
    }
</style>
{% endblock %}

{% block content %}
<a href="{% url 'jobs:list' %}" class="back-icon-btn" title="Back to Job Roles">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
    </svg>
</a>

<div class="jd-dropzone" id="jdDropZone">
    <svg class="jd-dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 13v8"/><path d="m8 17 4-4 4 4"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
    <div class="jd-dropzone-title">Drag &amp; Drop JD files here, or Click to browse</div>
    <div class="jd-dropzone-hint">PDF or DOCX only · upto 5 MB each</div>
</div>
<input type="file" id="jdFileInput" accept=".pdf,.docx" multiple hidden>

<div class="jd-file-list" id="jdFileList"></div>

<div class="jd-upload-actions">
    <button type="button" class="btn btn-primary hidden" id="jdStartBtn">Start Fetching Details</button>
    <span class="muted hidden" id="jdSummary"></span>
</div>

<script>
    window.JD_IMPORT_URLS = {
        batchStart: "{% url 'jdimport:batch_start' %}",
        upload: "{% url 'jdimport:upload_file' batch_id=0 %}",
        convert: "{% url 'jdimport:convert_file' file_id=0 %}",
        extract: "{% url 'jdimport:extract_file' file_id=0 %}"
    };
    window.JD_REVIEW_LIST_URL = "{% url 'jdimport:review_list' %}";

    (function () {
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(";").shift();
            return null;
        }

        const csrftoken = getCookie("csrftoken");
        const MAX_FILES = 10;

        const dropZone = document.getElementById("jdDropZone");
        const fileInput = document.getElementById("jdFileInput");
        const fileListEl = document.getElementById("jdFileList");
        const startBtn = document.getElementById("jdStartBtn");
        const summaryEl = document.getElementById("jdSummary");

        if (!dropZone || !fileInput) return;

        let selectedFiles = [];
        let importStarted = false;
        let importFinished = false;

        function renumber() {
            fileListEl.querySelectorAll(".jd-file-serial").forEach((el, i) => {
                el.textContent = i + 1;
            });
        }

        function renderFileList() {
            fileListEl.innerHTML = "";
            selectedFiles.forEach((entry, index) => {
                const row = document.createElement("div");
                row.className = "jd-file-row";
                row.id = `jd-row-${index}`;
                row.innerHTML = `
          <span class="jd-file-serial">${index + 1}</span>
          <div class="jd-file-name">${entry.file.name}</div>
          <div class="jd-progress-track"><div class="jd-progress-fill" data-fill></div></div>
          <span class="jd-progress-percent" data-percent>0%</span>
          <span class="jd-stage-text" data-stagetext></span>
          ${importStarted ? "" : `<button type="button" class="jd-file-remove" data-remove-index="${index}" title="Remove file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>`}
        `;
                fileListEl.appendChild(row);
            });

            if (!importStarted) {
                fileListEl.querySelectorAll("[data-remove-index]").forEach((btn) => {
                    btn.addEventListener("click", function () {
                        const idx = Number(btn.getAttribute("data-remove-index"));
                        selectedFiles.splice(idx, 1);
                        renderFileList();
                        toggleStartBtn();
                    });
                });
            }
        }

        function toggleStartBtn() {
            startBtn.classList.toggle("hidden", selectedFiles.length === 0 || importFinished);
        }

        function setProgress(index, percent, state) {
            const row = document.getElementById(`jd-row-${index}`);
            if (!row) return;
            const fill = row.querySelector('[data-fill]');
            const percentEl = row.querySelector('[data-percent]');
            fill.style.width = percent + '%';
            fill.classList.remove('state-done', 'state-failed');
            if (state) fill.classList.add('state-' + state);
            percentEl.textContent = percent + '%';
        }

        function setStageText(index, text, state) {
            const row = document.getElementById(`jd-row-${index}`);
            if (!row) return;
            const el = row.querySelector('[data-stagetext]');
            el.textContent = text;
            el.classList.remove('state-done', 'state-failed');
            if (state) el.classList.add('state-' + state);
        }

        function addFiles(fileArray) {
            const incoming = Array.from(fileArray).filter((file) => {
                const name = file.name.toLowerCase();
                return name.endsWith(".pdf") || name.endsWith(".docx");
            });
            const room = MAX_FILES - selectedFiles.length;
            const toAdd = incoming.slice(0, Math.max(room, 0)).map((file) => ({ file }));
            selectedFiles = selectedFiles.concat(toAdd).slice(0, MAX_FILES);
            renderFileList();
            toggleStartBtn();
        }

        dropZone.addEventListener("click", () => fileInput.click());
        dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
        dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            addFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });

        async function startBatch() {
            const response = await fetch(window.JD_IMPORT_URLS.batchStart, {
                method: "POST",
                headers: { "X-CSRFToken": csrftoken },
            });
            const data = await response.json();
            return data.batch_id;
        }

        async function uploadFile(batchId, entry, index) {
            setProgress(index, 10);
            setStageText(index, "Uploading...");
            const formData = new FormData();
            formData.append("file", entry.file);
            const response = await fetch(window.JD_IMPORT_URLS.upload.replace("0", batchId), {
                method: "POST", headers: { "X-CSRFToken": csrftoken }, body: formData,
            });
            const data = await response.json();
            if (!response.ok || data.error) {
                setProgress(index, 100, "failed");
                setStageText(index, data.error || "Upload failed.", "failed");
                return null;
            }
            setProgress(index, 30);
            return data.file_id;
        }

        async function convertFile(fileId, index) {
            setStageText(index, "Converting to DOCX...");
            setProgress(index, 45);
            const response = await fetch(window.JD_IMPORT_URLS.convert.replace("0", fileId), {
                method: "POST", headers: { "X-CSRFToken": csrftoken },
            });
            const data = await response.json();
            if (!response.ok || data.error) {
                setProgress(index, 100, "failed");
                setStageText(index, data.error || "Conversion failed.", "failed");
                return false;
            }
            setProgress(index, 65);
            return true;
        }

        async function extractFile(fileId, index) {
            setStageText(index, "Extracting job details...");
            setProgress(index, 80);
            const response = await fetch(window.JD_IMPORT_URLS.extract.replace("0", fileId), {
                method: "POST", headers: { "X-CSRFToken": csrftoken },
            });
            const data = await response.json();
            if (!response.ok || data.error) {
                setProgress(index, 100, "failed");
                setStageText(index, data.error || "Extraction failed.", "failed");
                return false;
            }
            setProgress(index, 100, "done");
            setStageText(index, "Ready for review", "done");
            return true;
        }

        async function processAll() {
            importStarted = true;
            renderFileList();
            renumber();
            startBtn.disabled = true;
            startBtn.textContent = "Processing...";
            const batchId = await startBatch();
            let successCount = 0;

            function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

            for (let index = 0; index < selectedFiles.length; index += 1) {
                const entry = selectedFiles[index];
                const fileId = await uploadFile(batchId, entry, index);
                if (!fileId) continue;
                const converted = await convertFile(fileId, index);
                if (!converted) continue;
                if (index > 0) await delay(1200);
                const extracted = await extractFile(fileId, index);
                if (extracted) successCount += 1;
            }

            importFinished = true;
            summaryEl.textContent = `${successCount} of ${selectedFiles.length} job description(s) are ready for review.`;
            summaryEl.classList.remove("hidden");

            if (successCount > 0) {
                startBtn.disabled = false;
                startBtn.classList.remove("hidden");
                startBtn.classList.remove("btn-primary");
                startBtn.classList.add("btn-success");
                startBtn.textContent = "Review New JDs";
                startBtn.onclick = function () { window.location.href = window.JD_REVIEW_LIST_URL; };
            } else {
                startBtn.classList.add("hidden");
            }
        }

        startBtn.addEventListener("click", processAll);
    })();
</script>
{% endblock %}
